# ChessLab production vhost (see docs/DECISIONS.md ADR-001, ADR-002, ADR-008; docs/SECURITY.md).
#
# This is the PRE-CERTBOT version. Install it as
#   /etc/nginx/sites-available/c.referee.at  (symlinked into sites-enabled)
# and then run `certbot --nginx -d c.referee.at --redirect`, which injects the
# `listen 443 ssl`, `ssl_certificate*`, options-ssl-nginx include and the
# HTTP->HTTPS redirect server block ("# managed by Certbot" lines).
# HSTS: max-age=31536000 without includeSubDomains/preload (other referee.at subdomains
# are not ours to commit), added once the certbot setup became permanent (ADR-002 revisited).
#
# nginx add_header inheritance: a location that declares any add_header loses
# ALL server-level add_header directives, so the security/isolation headers are
# repeated in every location that sets its own Cache-Control.

# Content-Security-Policy (docs/SECURITY.md §2.8). Generated from apps/web/csp.config.mjs;
# `node scripts/check-csp.mjs` fails when this copy drifts (e.g. the inline theme script in
# apps/web/index.html changed and its sha256 no longer matches). A map is used only to hold the
# value once; it does not depend on $host.
map $host $chesslab_csp {
    default "default-src 'self'; script-src 'self' 'sha256-YOswKRJVs+FwLZbQstA9GmeqiOLqFnNMWa/1cEzxiD0=' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://lichess.org https://api.chess.com wss://c.referee.at; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Abuse logging (docs/SECURITY.md §2.9): one line per request with status and timings, no bodies
# and no query strings (`$uri`, not `$request`), so tokens in URLs never reach the log. The
# fail2ban example in deploy/fail2ban/ parses this format (403/429 on /ws).
log_format chesslab '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                    'origin="$http_origin" ua="$http_user_agent"';

# Per-IP connection cap and handshake rate for the WebSocket endpoint (http context).
# A browser tab holds one socket; 10 concurrent sockets and 5 new handshakes/s (burst 20)
# per address leave room for reconnect storms but stop upgrade floods before Node sees them.
limit_conn_zone $binary_remote_addr zone=chesslab_ws:10m;
limit_req_zone $binary_remote_addr zone=chesslab_ws_req:10m rate=5r/s;

server {
    server_name c.referee.at;

    root /var/www/c.referee.at;
    index index.html;

    client_max_body_size 20m;

    access_log /var/log/nginx/c.referee.at.access.log chesslab;
    error_log /var/log/nginx/c.referee.at.error.log;

    # .wasm -> application/wasm comes from /etc/nginx/mime.types (already present).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json application/wasm
               image/svg+xml;

    # Cross-origin isolation (SharedArrayBuffer for multi-threaded WASM) + hygiene.
    # CSP: full policy incl. frame-ancestors 'none' (never embedded). HSTS: see top of file.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $chesslab_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Vite content-hashed assets: cache forever. Missing files are a real 404,
    # never the SPA shell.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $chesslab_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA shell: always revalidate. Also reached via the try_files fallback and
    # the `index` directive for "/".
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $chesslab_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ChessLab engine server WebSocket (127.0.0.1:8580, ADR-001). The server itself
    # checks the browser Origin (ADR-008); nginx caps connections and handshakes per IP.
    location /ws {
        limit_conn chesslab_ws 10;
        limit_conn_status 429;
        limit_req zone=chesslab_ws_req burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Liveness only ({status, version}); /health/detail stays on the loopback listener.
    location = /health {
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Everything else: static file, directory, or SPA fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
    listen [::]:80;
}
