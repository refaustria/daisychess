# ChessLab production vhost (see docs/DECISIONS.md ADR-001, ADR-002).
#
# This is the PRE-CERTBOT version. Install it as
#   /etc/nginx/sites-available/c.referee.at  (symlinked into sites-enabled)
# and then run `certbot --nginx -d c.referee.at --redirect`, which injects the
# `listen 443 ssl`, `ssl_certificate*`, options-ssl-nginx include and the
# HTTP->HTTPS redirect server block ("# managed by Certbot" lines).
# No HSTS on purpose.
#
# nginx add_header inheritance: a location that declares any add_header loses
# ALL server-level add_header directives, so the security/isolation headers are
# repeated in every location that sets its own Cache-Control.

server {
    listen 80;
    listen [::]:80;
    server_name c.referee.at;

    root /var/www/c.referee.at;
    index index.html;

    client_max_body_size 20m;

    # .wasm -> application/wasm comes from /etc/nginx/mime.types (already present).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json application/wasm
               image/svg+xml;

    # Cross-origin isolation (SharedArrayBuffer for multi-threaded WASM) + hygiene.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite content-hashed assets: cache forever. Missing files are a real 404,
    # never the SPA shell.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA shell: always revalidate. Also reached via the try_files fallback and
    # the `index` directive for "/".
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ChessLab engine server WebSocket (127.0.0.1:8580, ADR-001).
    location /ws {
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Everything else: static file, directory, or SPA fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
