# LEGACY vhost c.referee.at (ADR-021). The app moved to https://play.daisychess.org; this name
# only hands the browser state over and keeps old clients working for a transition period.
#
# SUNSET: <YYYY-MM-DD, to be decided by the owner; proposal: 6 months after the cut-over>.
# After the sunset date replace the transition locations (/ws, /link, /health, /assets/) with
# `return 301 https://play.daisychess.org$request_uri;` / 410, keep the "moved" page as long as
# the certificate is renewed, then drop the name.
#
# What happens here:
#   /                  the "moved" page (apps/web/legacy/, deployed by deploy/deploy-legacy.sh to
#                      /var/www/c.referee.at-legacy/). Its script reads this origin's
#                      `daisychess.*` localStorage, packs it into the URL *fragment* and replaces
#                      the location with https://play.daisychess.org/#migrate=<payload>, where the
#                      app imports it once (apps/web/src/migrate/). The fragment never reaches
#                      any server or log.
#   /assets/           the LAST app build, left in /var/www/c.referee.at/assets/, so tabs that are
#                      still open on the old origin can lazy-load chunks/workers until they reload.
#   /ws /link /health  still proxied to the engine server (old tabs, nodes with the old HUB_URL).
#                      ALLOWED_ORIGINS must keep https://c.referee.at until the sunset.
#   everything else    301 to the same path on play.daisychess.org (/portal/ included).
#
# Requires /etc/nginx/conf.d/daisychess-common.conf (log format, zones, CSP maps). Complete TLS
# version on the existing c.referee.at certificate lineage (renewal keeps working: certbot's
# nginx authenticator adds its challenge location itself).
#
# nginx add_header inheritance: every location with its own add_header repeats the headers.

server {
    server_name c.referee.at;

    root /var/www/c.referee.at-legacy;

    access_log /var/log/nginx/c.referee.at.access.log daisychess;
    error_log /var/log/nginx/c.referee.at.error.log;

    # The hand-over needs the origin in document.referrer on play.daisychess.org (the importer
    # only accepts payloads from https://c.referee.at), hence strict-origin (origin only, never
    # the path, never to http).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $daisychess_legacy_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ ^/(index\.html|moved\.js|migrate-core\.js|moved\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $daisychess_legacy_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Transition: the old build's hashed assets for still-open tabs (same headers as the app).
    location /assets/ {
        root /var/www/c.referee.at;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $daisychess_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Transition: engine WebSocket for old tabs (same limits and zones as play.daisychess.org).
    location /ws {
        limit_conn daisychess_ws 10;
        limit_conn_status 429;
        limit_req zone=daisychess_ws_req burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Transition: nodes still configured with HUB_URL=wss://c.referee.at/link.
    location /link {
        limit_conn daisychess_link 4;
        limit_conn_status 429;
        limit_req zone=daisychess_link_req burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Everything else (the portal, its API, old deep links): permanent redirect, path and query kept.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $daisychess_legacy_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 301 https://play.daisychess.org$request_uri;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/c.referee.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c.referee.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name c.referee.at;
    access_log /var/log/nginx/c.referee.at.access.log daisychess;
    return 301 https://$host$request_uri;
}
