# DaisyChess hub link host: wss://hub.daisychess.org/link (ADR-020 §3, ADR-021).
#
# Community nodes connect here (HUB_URL=wss://hub.daisychess.org/link). Only two paths exist:
# /link (node WebSocket, same limits and zones as the alias on play.daisychess.org) and /health
# (liveness). Everything else is 404: the app and the portal live on play.daisychess.org.
#
# Install as /etc/nginx/sites-available/hub.daisychess.org (symlinked into sites-enabled),
# together with /etc/nginx/conf.d/daisychess-common.conf (log format, zones, $daisychess_hub_csp).
# TLS: the daisychess.org lineage covers hub.daisychess.org.

server {
    server_name hub.daisychess.org;

    access_log /var/log/nginx/hub.daisychess.org.access.log daisychess;
    error_log /var/log/nginx/hub.daisychess.org.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $daisychess_hub_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Node link endpoint (ROLE=hub). Refused handshakes close with 1008 *after* the 101, so the
    # access log shows them as a 101 that lasted well under a second (rt=0.xxx);
    # deploy/fail2ban/filter.d/daisychess-link.conf counts those.
    location /link {
        limit_conn daisychess_link 4;
        limit_conn_status 429;
        limit_req zone=daisychess_link_req burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Liveness only ({status, version}); /health/detail stays on the loopback listener.
    location = /health {
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/daisychess.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daisychess.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.daisychess.org;
    access_log /var/log/nginx/hub.daisychess.org.access.log daisychess;
    return 301 https://$host$request_uri;
}
