# daisychess.org — the public community website (apps/site, M27-1). Static files only.
#
# Install as /etc/nginx/sites-available/daisychess.org (symlinked into sites-enabled). The
# certificate /etc/letsencrypt/live/daisychess.org/ covers daisychess.org, www.daisychess.org and
# play.daisychess.org; play.* has its own vhost (the web app), this file serves the apex and
# redirects www -> apex. Content: deploy/deploy-site.sh rsyncs apps/site/dist to the root below.
# `node scripts/check-site-csp.mjs` verifies that the CSP and the security headers below match
# apps/site/csp.config.mjs (the e2e tests run against exactly those headers).
# HSTS: one year, without includeSubDomains/preload for now (decide once every subdomain is
# HTTPS-only for good).

# Content-Security-Policy of the site (apps/site/csp.config.mjs, SITE_CSP). No inline scripts or
# styles; three.js, gsap and Lenis need nothing beyond 'self'. A map only holds the value once.
map $host $daisychess_site_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Cache policy by path, so every location inherits the server-level add_header set (nginx drops
# all inherited add_header directives in a location that declares its own).
#   /assets/  Vite content-hashed files (JS, CSS, fonts): immutable for a year.
#   images, icons, manifest, robots, sitemap: one day (stable names, rarely change).
#   everything else (HTML): always revalidate.
map $uri $daisychess_site_cache {
    ~^/assets/                                                   "public, max-age=31536000, immutable";
    ~\.(?:png|webp|svg|ico|webmanifest|txt|xml)$                 "public, max-age=86400";
    default                                                      "no-cache";
}

# HTTP -> HTTPS (apex and www). ACME HTTP-01 challenges are answered from the site root so a
# webroot renewal works too (certbot --nginx does not need it).
server {
    listen 80;
    listen [::]:80;
    server_name daisychess.org www.daisychess.org;

    location /.well-known/acme-challenge/ {
        root /var/www/daisychess.org;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://daisychess.org$request_uri;
    }
}

# www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.daisychess.org;

    ssl_certificate /etc/letsencrypt/live/daisychess.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daisychess.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://daisychess.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name daisychess.org;

    ssl_certificate /etc/letsencrypt/live/daisychess.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daisychess.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/daisychess.org;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1k;

    # log_format `daisychess` (no query strings) is declared once in deploy/nginx/daisychess-common.conf
    # (/etc/nginx/conf.d/); retention: see the privacy policy.
    access_log /var/log/nginx/daisychess.org.access.log daisychess;
    error_log /var/log/nginx/daisychess.org.error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # Security headers (mirrored by `vite preview` from apps/site/csp.config.mjs; checked by
    # scripts/check-site-csp.mjs). All locations inherit them except /stats/ (see there).
    add_header Content-Security-Policy $daisychess_site_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $daisychess_site_cache always;

    # Static only: anything but GET/HEAD is refused.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    error_page 404 /404.html;

    # Hashed assets: a missing file is a 404 (the 404 page), never another file in its place.
    location /assets/ {
        try_files $uri =404;
    }

    # mime.types has no webmanifest entry.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Pages are directories with an index.html (/features/ -> /features/index.html). A path
    # without the trailing slash is redirected by nginx's directory handling (relative redirect).
    absolute_redirect off;
    location / {
        try_files $uri $uri/ =404;
    }

    # Owner-only traffic reports (GoAccess, deploy/stats/, deploy/README.md "Traffic stats"). The
    # htpasswd file is created on the host and never lives in the repo. This location declares its
    # own add_header, so nginx drops the inherited ones: the common security headers are repeated
    # here. GoAccess HTML embeds its scripts and styles inline, hence 'unsafe-inline' (and 'unsafe-eval': its templates use new Function) - on /stats/
    # only, which serves nothing but the generated reports, and still without external sources.
    # access_log off: the owner's visits are not logged. check-site-csp.mjs checks this block separately.
    location = /stats {
        return 301 /stats/;
    }
    location /stats/ {
        alias /var/www/daisychess-stats/;
        index index.html;
        auth_basic "DaisyChess stats";
        auth_basic_user_file /etc/nginx/daisychess-stats.htpasswd;
        access_log off;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # No dotfiles (none are deployed, but never serve one by accident).
    location ~ /\.(?!well-known/) {
        return 404;
    }
}
