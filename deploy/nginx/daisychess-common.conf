# DaisyChess shared http-context declarations (ADR-021). Install ONCE as
#   /etc/nginx/conf.d/daisychess-common.conf
# It holds everything the three vhosts share: the CSP values, the access log format and the
# rate-limit zones. nginx refuses duplicate map variables, log formats and zone names, and a
# log_format must be declared before the first server that uses it (Debian's nginx.conf includes
# conf.d/*.conf before sites-enabled/*, and sites-enabled/c.referee.at sorts before play.*), so
# these live here and not in any vhost file:
#   sites-available/play.daisychess.org   app + portal + /ws + /link + /api/portal/
#   sites-available/hub.daisychess.org    /link + /health only (community nodes)
#   sites-available/c.referee.at          legacy: "moved" page + transition proxies
#
# Content-Security-Policy values (docs/SECURITY.md §2.8). Generated from apps/web/csp.config.mjs
# and apps/portal/csp.config.mjs; `node scripts/check-csp.mjs` fails when a copy drifts (e.g. the
# inline theme script in apps/web/index.html changed and its sha256 no longer matches) and prints
# the expected line. The maps only hold each value once; they do not depend on $host.

# The app (play.daisychess.org, and the old app assets on c.referee.at during the transition).
map $host $daisychess_csp {
    default "default-src 'self'; script-src 'self' 'sha256-SMSqO1M1II4kAAVrbA6nO0K81/vI2V4QXj1JkHTnMm8=' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://lichess.org https://explorer.lichess.org https://api.chess.com wss://play.daisychess.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# The operator portal (/portal/, apps/portal). Stricter than the app's: no inline script, no
# workers, no WebAssembly; connect-src adds only lichess.org (OAuth).
map $host $daisychess_portal_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://lichess.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# The legacy c.referee.at "moved" page (apps/web/legacy/): one module script, one stylesheet,
# no network access.
map $host $daisychess_legacy_csp {
    default "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

# hub.daisychess.org serves no documents (only /link and /health).
map $host $daisychess_hub_csp {
    default "default-src 'none'; frame-ancestors 'none'";
}

# Abuse logging (docs/SECURITY.md §2.9): one line per request with status and timings, no bodies
# and no query strings (`$uri`, not `$request`), so tokens in URLs never reach the log (URL
# fragments such as #migrate= and #setup-token= are never sent at all). The fail2ban examples in
# deploy/fail2ban/ parse this format (403/429 on /ws; 429 and short-lived 101 on /link). The
# application log carries only a daily-salted IP hash (M24-15), so the access logs are the one
# place with raw addresses: retention is the stock logrotate (14 days).
log_format daisychess '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                    'origin="$http_origin" ua="$http_user_agent"';

# Per-IP connection cap and handshake rate for the WebSocket endpoint /ws. A browser tab holds one
# socket; 10 concurrent sockets and 5 new handshakes/s (burst 20) per address leave room for
# reconnect storms but stop upgrade floods before Node sees them. Shared by play.daisychess.org
# and the transition proxy on c.referee.at (one budget per address across both names).
limit_conn_zone $binary_remote_addr zone=daisychess_ws:10m;
limit_req_zone $binary_remote_addr zone=daisychess_ws_req:10m rate=5r/s;
# Node link endpoint /link (ROLE=hub, ADR-020): a node holds one socket and reconnects with
# 1-60 s backoff, so 2 handshakes/s per address is generous. Shared by hub.daisychess.org, the
# alias on play.daisychess.org and the transition proxy on c.referee.at.
limit_conn_zone $binary_remote_addr zone=daisychess_link:10m;
limit_req_zone $binary_remote_addr zone=daisychess_link_req:10m rate=2r/s;
# Operator portal API (/api/portal/): 10 requests/s per address, burst 30 (the hub adds its own
# per-IP and per-session limits behind this).
limit_req_zone $binary_remote_addr zone=daisychess_portal:10m rate=10r/s;
