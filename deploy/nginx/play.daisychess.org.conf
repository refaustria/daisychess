# DaisyChess production vhost: https://play.daisychess.org (web app, operator portal under
# /portal/, puzzle data /puzzles/v1/, engine WebSocket /ws, hub link alias /link, portal API
# /api/portal/).
# See docs/DECISIONS.md ADR-001, ADR-002, ADR-008, ADR-020, ADR-021; docs/SECURITY.md.
#
# Install as /etc/nginx/sites-available/play.daisychess.org (symlinked into sites-enabled),
# together with /etc/nginx/conf.d/daisychess-common.conf (CSP maps, log format and rate-limit
# zones; required, this file declares none of them). Complete TLS version: the certificate
# lineage /etc/letsencrypt/live/daisychess.org/ already exists, no certbot --nginx run needed.
# HSTS: max-age=31536000 without includeSubDomains/preload (the apex site and its other
# subdomains are separate sites; commit to that only deliberately).
#
# nginx add_header inheritance: a location that declares any add_header loses
# ALL server-level add_header directives, so the security/isolation headers are
# repeated in every location that sets its own Cache-Control.
# Content-Security-Policy: $daisychess_csp (app) and $daisychess_portal_csp (portal), defined in
# daisychess-common.conf and verified by `node scripts/check-csp.mjs`.

server {
    server_name play.daisychess.org;

    root /var/www/play.daisychess.org;
    index index.html;

    client_max_body_size 20m;

    access_log /var/log/nginx/play.daisychess.org.access.log daisychess;
    error_log /var/log/nginx/play.daisychess.org.error.log;

    # .wasm -> application/wasm comes from /etc/nginx/mime.types (already present).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json application/wasm
               image/svg+xml;

    # Cross-origin isolation (SharedArrayBuffer for multi-threaded WASM) + hygiene.
    # CSP: full policy incl. frame-ancestors 'none' (never embedded). HSTS: see top of file.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $daisychess_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Vite content-hashed assets: cache forever. Missing files are a real 404,
    # never the SPA shell.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $daisychess_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA shell: always revalidate. Also reached via the try_files fallback and
    # the `index` directive for "/".
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $daisychess_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Puzzle data (ADR-023 §5), published by deploy/deploy-puzzles.sh into $root/puzzles/v1/
    # (deploy-web.sh excludes /puzzles/ from its --delete). Public CC0 data, also fetched by the
    # mobile apps from their own origin (app.daisychess.org, ADR-022 §4): CORP cross-origin and
    # Access-Control-Allow-Origin for exactly the app origins ($daisychess_app_cors, a map in
    # daisychess-common.conf; empty = header not sent), Vary: Origin for caches. Shards are
    # content-addressed (immutable); the index names them and is revalidated hourly. A missing
    # file is a real 404 (the client falls back to cached shards / the bundled starter), never
    # the SPA shell. `always` keeps the CORS header on a 404, so the app sees the status.
    location /puzzles/v1/shards/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin $daisychess_app_cors always;
        add_header Vary "Origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $daisychess_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /puzzles/v1/index.json {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin $daisychess_app_cors always;
        add_header Vary "Origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $daisychess_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Any other /puzzles/ path: a real 404 instead of the SPA shell (server-level headers).
    location /puzzles/ {
        try_files $uri =404;
    }

    # DaisyChess engine server WebSocket (127.0.0.1:8580, ADR-001). The server itself
    # checks the browser Origin (ADR-008); nginx caps connections and handshakes per IP.
    location /ws {
        limit_conn daisychess_ws 10;
        limit_conn_status 429;
        limit_req zone=daisychess_ws_req burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hub link endpoint for community nodes (ROLE=hub only; ADR-020 §3). The canonical name is
    # wss://hub.daisychess.org/link (hub.daisychess.org.conf); this is the alias on the app host
    # (ADR-021), same limits and the same zones, so one address gets one budget across both
    # names. Without a hub this location is harmless (the standalone server answers 404/400). Refused handshakes close
    # the socket with 1008 *after* the 101, so the access log shows them as a 101 that lasted
    # well under a second (rt=0.xxx); deploy/fail2ban/filter.d/daisychess-link.conf counts those.
    location /link {
        limit_conn daisychess_link 4;
        limit_conn_status 429;
        limit_req zone=daisychess_link_req burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Liveness only ({status, version}); /health/detail stays on the loopback listener.
    location = /health {
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Operator portal SPA (apps/portal built with base /portal/, deployed by deploy/deploy-portal.sh
    # into $root/portal/). Its own CSP; no cross-origin isolation headers (not needed, and COEP
    # would only get in the way of the lichess OAuth round trip). Hashed assets are immutable and a
    # missing asset is a real 404; every other /portal/ path falls back to the shell (client-side
    # views). `Referrer-Policy: no-referrer` keeps the OAuth `?code=` from ever leaving the page.
    location /portal/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $daisychess_portal_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /portal/index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $daisychess_portal_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $daisychess_portal_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Operator portal API (hub, ROLE=hub only; ADR-020 §2). Tiny JSON bodies; the hub trusts
    # X-Real-IP from this proxy (TRUSTED_PROXIES) for its per-IP limits and never logs it. The
    # session cookie (__Host-dc_portal) and the CSRF/Origin checks are the hub's business, so Host
    # and Origin are passed through untouched.
    location /api/portal/ {
        client_max_body_size 16k;
        limit_req zone=daisychess_portal burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Web app manifest: mime.types has no webmanifest entry. No add_header here, so the
    # server-level security headers are inherited.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # App-link association files for the iOS/Android apps (ADR-022 §4, docs/SECURITY.md §2.10).
    # Apple's AASA has no extension, so it needs an explicit type; it must be served over HTTPS
    # without a redirect. A missing file is a real 404 (assetlinks.json is only shipped once
    # PLAY_SIGNING_SHA256 is set), never the SPA shell. No add_header here, so the server-level
    # security headers are inherited.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Everything else: static file, directory, or SPA fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TLS: the daisychess.org lineage covers daisychess.org, www, play and hub.
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 on every daisychess.org vhost: they share one certificate, so browsers reuse an h2
    # connection across them, and nginx answers 421 for a vhost with http2 off.
    http2 on;
    ssl_certificate /etc/letsencrypt/live/daisychess.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daisychess.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP: redirect only (certbot renews through its nginx authenticator, which adds the
# ACME challenge location itself).
server {
    listen 80;
    listen [::]:80;
    server_name play.daisychess.org;
    access_log /var/log/nginx/play.daisychess.org.access.log daisychess;
    return 301 https://$host$request_uri;
}
