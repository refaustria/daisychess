# fail2ban filter for DaisyChess WebSocket abuse (docs/SECURITY.md, "Abuse logging").
# Parses the `daisychess` log_format of deploy/nginx/daisychess-common.conf:
#   1.2.3.4 [23/Oct/2026:11:16:46 +0200] "GET /ws HTTP/1.1" 429 ...
# 403 = Origin rejected by the engine server (ADR-008); 429 = nginx limit_conn/limit_req on /ws.
# Engine-level refusals (`no_capacity`, `rate_limited`) happen inside an accepted socket and
# are not visible here; they are bounded by the server's own limits.
[Definition]
failregex = ^<HOST> \[[^\]]+\] "[A-Z]+ /ws(?:/\S*)? HTTP/[\d.]+" (?:403|429) 
ignoreregex =
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
