# fail2ban filter for abuse of the hub's node link endpoint /link (docs/SECURITY.md §6, M24-15).
# Parses the `daisychess` log_format of deploy/nginx/c.referee.at.conf:
#   1.2.3.4 [23/Oct/2026:11:16:46 +0200] "GET /link HTTP/1.1" 101 0 rt=0.012 urt=0.011 ...
# The application log deliberately holds no raw addresses (daily-salted hash only), so the
# raw address comes from nginx. Two patterns:
#   - 429 / 403 on /link: nginx limit_conn / limit_req or a foreign proxy rule.
#   - 101 with rt < 1 s: the upgrade succeeded and the hub closed the socket right away with
#     1008 (bad/revoked node token, incompatible link version, invalid node.hello). A real node
#     link stays open for minutes to days, so a sub-second 101 is a refused handshake.
[Definition]
failregex = ^<HOST> \[[^\]]+\] "[A-Z]+ /link(?:/\S*)? HTTP/[\d.]+" (?:403|429) 
            ^<HOST> \[[^\]]+\] "[A-Z]+ /link(?:/\S*)? HTTP/[\d.]+" 101 \d+ rt=0\.\d+ 
ignoreregex =
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
