# fail2ban jail for DaisyChess (example; see deploy/README.md "Abuse logging and fail2ban").
# Bans an address for 10 min after 30 refused WebSocket upgrades (403/429 on /ws) within 60 s.
# A legitimate tab reconnects with backoff and stays far below this; a reconnect storm from a
# shared NAT can reach the nginx 429 burst, hence the generous threshold.
[daisychess-ws]
enabled  = true
filter   = daisychess-ws
port     = http,https
logpath  = /var/log/nginx/c.referee.at.access.log
backend  = auto
maxretry = 30
findtime = 60
bantime  = 600
