# fail2ban jail for the hub's /link endpoint (example; see deploy/README.md "Abuse logging and
# fail2ban"). Bans an address for 1 h after 10 refused or rate-limited link handshakes within
# 10 min. A node with a wrong token exits (fatal link end) instead of retrying, so a legitimate
# operator stays far below this; a NAT with several misconfigured nodes may need a higher value.
[daisychess-link]
enabled  = true
filter   = daisychess-link
port     = http,https
# All DaisyChess vhosts log in the same `daisychess` format (deploy/nginx/daisychess-common.conf).
logpath  = /var/log/nginx/play.daisychess.org.access.log
           /var/log/nginx/hub.daisychess.org.access.log
           /var/log/nginx/c.referee.at.access.log
backend  = auto
maxretry = 10
findtime = 600
bantime  = 3600
