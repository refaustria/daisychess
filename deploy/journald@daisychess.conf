# journald namespace for the DaisyChess server (unit: LogNamespace=daisychess).
# Install to /etc/systemd/journald@daisychess.conf (deploy/deploy-server.sh does this).
# Own journal instance, so the host-wide /etc/systemd/journald.conf stays untouched.
# Privacy policy: application logs are deleted after 7 days.
[Journal]
MaxRetentionSec=7day
SystemMaxUse=200M
