# ChessLab web container. Mirrors deploy/nginx/c.referee.at.conf (headers, cache, proxy);
# TLS is expected to be terminated by a reverse proxy in front, which should also send HSTS.
# Note: add_header in a location drops server-level add_headers, so they are repeated.

# Resolve `server` lazily (Docker DNS) so nginx starts even if the server is down.
resolver 127.0.0.11 valid=10s ipv6=off;

# Content-Security-Policy (docs/SECURITY.md §2.8; same policy as deploy/nginx). Generated from apps/web/csp.config.mjs;
# `node scripts/check-csp.mjs` fails when this copy drifts (e.g. the inline theme script in
# apps/web/index.html changed and its sha256 no longer matches). A map is used only to hold the
# value once; it does not depend on $host.
map $host $chesslab_csp {
    default "default-src 'self'; script-src 'self' 'sha256-YOswKRJVs+FwLZbQstA9GmeqiOLqFnNMWa/1cEzxiD0=' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://lichess.org https://explorer.lichess.org https://api.chess.com wss://c.referee.at; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Abuse logging (docs/SECURITY.md §2.9): one line per request with status and timings, no bodies
# and no query strings (`$uri`, not `$request`), so tokens in URLs never reach the log. The
# fail2ban example in deploy/fail2ban/ parses this format (403/429 on /ws).
log_format chesslab '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                    'origin="$http_origin" ua="$http_user_agent"';

# Per-IP WebSocket caps (mirrors the production vhost): 10 sockets, 5 handshakes/s, burst 20.
limit_conn_zone $binary_remote_addr zone=chesslab_ws:10m;
limit_req_zone $binary_remote_addr zone=chesslab_ws_req:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The official image links access.log to stdout (`docker compose logs web`).
    access_log /var/log/nginx/access.log chesslab;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json application/wasm image/svg+xml;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $chesslab_csp always;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $chesslab_csp always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $chesslab_csp always;
    }

    location /ws {
        limit_conn chesslab_ws 10;
        limit_conn_status 429;
        limit_req zone=chesslab_ws_req burst=20 nodelay;
        limit_req_status 429;
        set $upstream http://server:8580;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        set $upstream http://server:8580;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
