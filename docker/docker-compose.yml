# ChessLab server mode.   docker compose -f docker/docker-compose.yml up --build -d
# Public entry point: http://localhost:${WEB_PORT:-8080}  (web UI, /ws, /health)
name: chesslab

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: chesslab-server
    env_file: server.env
    init: true            # tini as PID 1 (also installed in the image)
    restart: unless-stopped
    # Suggested limits (Stockfish Threads x MAX_SESSIONS should not exceed cpus;
    # Hash x concurrent engines must fit in memory):
    # cpus: 4
    # mem_limit: 2g
    networks: [chesslab]
    # Publish the engine server directly (e.g. for a web app hosted elsewhere):
    # ports:
    #   - "8580:8580"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8580/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: chesslab-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks: [chesslab]
    ports:
      - "${WEB_PORT:-8080}:80"

networks:
  chesslab:
