# DaisyChess server mode.   docker compose -f docker/docker-compose.yml up --build -d
# Public entry point: http://localhost:${WEB_PORT:-8080}  (web UI, /ws, /health)
name: daisychess

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: daisychess-server
    env_file: server.env
    init: true            # tini as PID 1 (also installed in the image)
    restart: unless-stopped
    # Hardening (docs/SECURITY.md): unprivileged user in the image, no capability, no privilege
    # escalation, immutable root filesystem (the server writes nothing; /tmp is a tmpfs).
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Review store (ADR-017): the only writable path; reproducible data, no backup needed.
    volumes:
      - reviews:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Suggested limits (Stockfish Threads x MAX_SESSIONS should not exceed cpus;
    # Hash x concurrent engines must fit in memory):
    # cpus: 4
    # mem_limit: 2g
    networks: [daisychess]
    # Publish the engine server directly (e.g. for a web app hosted elsewhere):
    # ports:
    #   - "8580:8580"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8580/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: daisychess-web
    restart: unless-stopped
    # nginx's master process still needs to bind :80 and drop to the nginx user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    depends_on:
      server:
        condition: service_healthy
    networks: [daisychess]
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  reviews:

networks:
  daisychess:
