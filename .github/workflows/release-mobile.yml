name: Release mobile apps
# iOS and Android store builds of apps/mobile (ADR-022 §6, M26-8; deploy/README.md "Mobile release").
# Trigger: push a tag `mobile-v<x.y.z>` matching apps/mobile/package.json `version` → signed AAB
# (workflow artifact; Play internal track when the variable PLAY_PUBLISH_ENABLED is 'true') and a
# signed IPA uploaded to TestFlight. Build number (versionCode / CFBundleVersion) = run number.
#
# workflow_dispatch: `dry_run` (default) builds everything without uploading to a store: signed
# when the signing secrets are present, unsigned otherwise. `dry_run: false` is accepted only when
# the workflow runs on a mobile-v* tag (re-run of a release with a fresh build number).
#
# Secrets (names only; values are set by the owner with scripts/mobile/*.sh):
#   ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
#   ANDROID_UPLOAD_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON, IOS_DIST_CERT_P12_B64,
#   IOS_DIST_CERT_PASSWORD, ASC_API_KEY_P8_B64, optional IOS_PROVISIONING_PROFILE_B64.
# Variables: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, PLAY_PUBLISH_ENABLED.
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build (and sign when secrets exist) without uploading to the stores
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time: both jobs touch shared store state (provisioning profile, Play edits).
concurrency:
  group: release-mobile
  cancel-in-progress: false

env:
  APP_ID: org.daisychess.app
  # Name of the App Store profile the iOS job creates/reuses through the App Store Connect API.
  IOS_PROFILE_NAME: DaisyChess App Store CI

# Third-party actions are pinned by full commit SHA (tags are mutable); the release tag is in the
# trailing comment. Bump SHA and comment together (`git ls-remote https://github.com/<repo> <tag>`).

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
      upload: ${{ steps.v.outputs.upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          upload=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            upload=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::dry_run=false needs the workflow to run on a mobile-v* tag (Use workflow from: Tags)"
              exit 1
            fi
            upload=true
          fi
          ref=''
          if [ "$REF_TYPE" = tag ]; then ref=$REF_NAME; fi
          node apps/mobile/scripts/release-version.mjs "$ref" "$RUN_NUMBER" | tee -a "$GITHUB_OUTPUT"
          echo "upload=$upload" | tee -a "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UPLOAD: ${{ needs.prepare.outputs.upload }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DAISYCHESS_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
      PUBLISH: ${{ needs.prepare.outputs.upload == 'true' && vars.PLAY_PUBLISH_ENABLED == 'true' }}
    steps:
      # Fail before building when a store upload is due and an input is missing.
      - id: inputs
        name: Check signing inputs
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 != '' }}
          HAS_STORE_PW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
          HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_KEYSTORE" = true ] || missing+=(ANDROID_UPLOAD_KEYSTORE_B64)
          [ "$HAS_STORE_PW" = true ] || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          [ "$HAS_ALIAS" = true ] || missing+=(ANDROID_UPLOAD_KEY_ALIAS)
          [ "$HAS_KEY_PW" = true ] || missing+=(ANDROID_UPLOAD_KEY_PASSWORD)
          if [ "$PUBLISH" = true ] && [ "$HAS_PLAY_SA" != true ]; then
            echo "::error::PLAY_PUBLISH_ENABLED is 'true' but the secret PLAY_SERVICE_ACCOUNT_JSON is missing"
            exit 1
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOAD" = true ]; then
            echo "::error::release build without signing secrets: ${missing[*]} (deploy/README.md, Mobile release)"
            exit 1
          else
            echo "::notice::dry run without ${missing[*]}: building an unsigned AAB"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daisychess/engine-core build
      # Production mobile web build (no smoke hook) → check-dist → cap sync.
      - run: pnpm --filter @daisychess/mobile build
      - name: Committed native project unchanged by cap sync
        run: git diff --exit-code -- apps/mobile
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Decode upload keystore
        if: steps.inputs.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
      - name: Build release AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify and name the AAB
        env:
          SIGNED: ${{ steps.inputs.outputs.signed }}
        run: |
          set -euo pipefail
          aab=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          merged=$(find apps/mobile/android/app/build/intermediates -path '*release*' -name AndroidManifest.xml -print0 \
            | xargs -0 grep -ho 'android:versionCode="[0-9]*"' | sort -u)
          echo "manifest: $merged"
          test "$merged" = "android:versionCode=\"$DAISYCHESS_VERSION_CODE\""
          suffix=''
          if [ "$SIGNED" = true ]; then
            jarsigner -verify -strict "$aab" > /dev/null
            # Public upload certificate fingerprint (Play Console → App integrity → Upload key).
            keytool -printcert -jarfile "$aab" | grep -E '^(Owner|[[:space:]]*SHA256):'
          else
            suffix=-unsigned
          fi
          mkdir -p "$RUNNER_TEMP/out"
          out="$RUNNER_TEMP/out/daisychess-$VERSION-$DAISYCHESS_VERSION_CODE$suffix.aab"
          cp "$aab" "$out"
          echo "AAB=$out" >> "$GITHUB_ENV"
          ls -l "$out"
      # Always kept: the first Play upload is manual (deploy/README.md), later ones are a fallback.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab-${{ env.VERSION }}-${{ env.DAISYCHESS_VERSION_CODE }}
          path: ${{ env.AAB }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the Play internal track
        if: env.PUBLISH == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          node apps/mobile/scripts/play-publish.mjs --aab "$AAB" --package "$APP_ID"
          --track internal --release-name "$VERSION ($DAISYCHESS_VERSION_CODE)"
      - name: Play publishing disabled
        if: env.UPLOAD == 'true' && env.PUBLISH != 'true'
        run: |
          echo "::notice::PLAY_PUBLISH_ENABLED is not 'true': upload the android-aab artifact in Play Console by hand"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

  ios:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    env:
      UPLOAD: ${{ needs.prepare.outputs.upload }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - id: inputs
        name: Check signing inputs
        env:
          HAS_CERT: ${{ secrets.IOS_DIST_CERT_P12_B64 != '' }}
          HAS_CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD != '' }}
          HAS_P8: ${{ secrets.ASC_API_KEY_P8_B64 != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_CERT" = true ] || missing+=(secret:IOS_DIST_CERT_P12_B64)
          [ "$HAS_CERT_PW" = true ] || missing+=(secret:IOS_DIST_CERT_PASSWORD)
          [ "$HAS_P8" = true ] || missing+=(secret:ASC_API_KEY_P8_B64)
          [ -n "$TEAM_ID" ] || missing+=(variable:APPLE_TEAM_ID)
          [ -n "$ASC_KEY_ID" ] || missing+=(variable:ASC_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || missing+=(variable:ASC_ISSUER_ID)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOAD" = true ]; then
            echo "::error::release build without signing inputs: ${missing[*]} (deploy/README.md, Mobile release)"
            exit 1
          else
            echo "::notice::dry run without ${missing[*]}: building an unsigned archive"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daisychess/engine-core build
      - run: pnpm --filter @daisychess/mobile build
      - name: Committed native project unchanged by cap sync
        run: git diff --exit-code -- apps/mobile
      - name: Select Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          echo "using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Temporary keychain with the distribution identity; API key for the profile and the upload.
      - name: Signing setup
        if: steps.inputs.outputs.signed == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir" "$HOME/private_keys"
          echo "SIGNING_DIR=$dir" >> "$GITHUB_ENV"
          kc="$dir/release.keychain-db"
          kcpw=$(uuidgen)
          echo "::add-mask::$kcpw"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CERT_B64" | base64 --decode > "$dir/dist.p12"
          security import "$dir/dist.p12" -k "$kc" -f pkcs12 -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$dir/dist.p12"
          # Apple WWDR intermediates (pinned SHA-256) so the identity validates without the image's.
          for pin in G3:dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f \
                     G6:bdd4ed6e74691f0c2bfd01be0296197af1379e0418e2d300efa9c3bef642ca30; do
            g=${pin%%:*}
            f="$dir/AppleWWDRCA$g.cer"
            if curl -fsSL --retry 3 -o "$f" "https://www.apple.com/certificateauthority/AppleWWDRCA$g.cer" \
              && [ "$(shasum -a 256 "$f" | cut -d' ' -f1)" = "${pin#*:}" ]; then
              security import "$f" -k "$kc" > /dev/null || true
            else
              echo "::warning::could not fetch/verify Apple WWDR $g; relying on the runner image"
            fi
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | awk '/(Apple|iPhone) Distribution/ { print $2; exit }')
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error::IOS_DIST_CERT_P12_B64 holds no valid Apple Distribution identity"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          security find-certificate -a -p "$kc" > "$dir/certs.pem"
          # altool looks in ~/private_keys; asc-profile.mjs gets the path.
          printf '%s' "$P8_B64" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # App Store profile: the explicit IOS_PROVISIONING_PROFILE_B64 when set, otherwise created or
      # reused through the App Store Connect API for the imported certificate (asc-profile.mjs).
      - name: Provisioning profile
        if: steps.inputs.outputs.signed == 'true'
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          profile="$SIGNING_DIR/profile.mobileprovision"
          if [ -n "$PROFILE_B64" ]; then
            echo "using the profile from IOS_PROVISIONING_PROFILE_B64"
            printf '%s' "$PROFILE_B64" | base64 --decode > "$profile"
          else
            node apps/mobile/scripts/asc-profile.mjs --bundle-id "$APP_ID" --cert "$SIGNING_DIR/certs.pem" \
              --name "$IOS_PROFILE_NAME" --out "$profile"
          fi
          security cms -D -i "$profile" > "$SIGNING_DIR/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$SIGNING_DIR/profile.plist"; }
          uuid=$(pb UUID)
          echo "profile $(pb Name) ($uuid), expires $(pb ExpirationDate)"
          test "$(pb Entitlements:application-identifier)" = "$TEAM_ID.$APP_ID"
          echo "profile associated domains: $(pb Entitlements:com.apple.developer.associated-domains 2> /dev/null | tr -s ' \n' ' ' || echo none)"
          if pb Entitlements:get-task-allow 2>/dev/null | grep -q true; then
            echo "::error::the profile is a development profile, not an App Store one"
            exit 1
          fi
          if pb ProvisionedDevices > /dev/null 2>&1; then
            echo "::error::the profile lists devices (ad hoc), not an App Store one"
            exit 1
          fi
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$profile" "$d/$uuid.mobileprovision"
          done
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: apps/mobile/ios/App
        env:
          SIGNED: ${{ steps.inputs.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            node ../../scripts/ios-signing.mjs patch App.xcodeproj/project.pbxproj \
              --team "$TEAM_ID" --bundle-id "$APP_ID" --profile "$PROFILE_UUID" --identity "$IDENTITY"
            signing=("OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN")
          else
            signing=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild -quiet -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ../DerivedData \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${signing[@]}" archive
          plist="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$VERSION"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$plist")" = false

      - name: Export IPA
        if: steps.inputs.outputs.signed == 'true'
        run: |
          set -euo pipefail
          node apps/mobile/scripts/ios-signing.mjs export-options "$SIGNING_DIR/ExportOptions.plist" \
            --team "$TEAM_ID" --bundle-id "$APP_ID" --profile "$PROFILE_UUID" --identity "$IDENTITY"
          if ! xcodebuild -quiet -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"; then
            echo "::error::Export failed. If the log mentions entitlements (e.g. com.apple.developer.associated-domains), enable that capability on the App ID $APP_ID (Certificates, Identifiers & Profiles) and rerun: asc-profile.mjs recreates a profile that lacks it. With IOS_PROVISIONING_PROFILE_B64 set, regenerate that profile by hand."
            exit 1
          fi
          ipa="$RUNNER_TEMP/export/daisychess-$VERSION-$BUILD_NUMBER.ipa"
          mv "$RUNNER_TEMP/export/App.ipa" "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          # Store signature, store entitlements (no get-task-allow, associated domains present).
          x="$RUNNER_TEMP/ipa-check"
          mkdir -p "$x"
          unzip -q "$ipa" -d "$x"
          codesign --verify --strict --deep "$x/Payload/App.app"
          codesign -dvv "$x/Payload/App.app" 2>&1 | grep -E '^(Authority|TeamIdentifier)=' | head -2
          codesign -d --entitlements - --xml "$x/Payload/App.app" 2> /dev/null > "$x/ent.plist"
          # PlistBuddy, not plutil -extract: plutil splits key paths at '.', so a dotted
          # entitlement name is never found.
          ent() { /usr/libexec/PlistBuddy -c "Print :$1" "$x/ent.plist"; }
          domains=$(ent com.apple.developer.associated-domains 2> /dev/null || true)
          echo "associated domains: $(echo "$domains" | tr -s ' \n' ' ')"
          wants=$(sed -n 's|.*<string>\(applinks:[^<]*\)</string>.*|\1|p' apps/mobile/ios/App/App/App.entitlements)
          test -n "$wants"
          for want in $wants; do
            if ! printf '%s\n' "$domains" | sed 's/^[[:space:]]*//' | grep -qxF "$want"; then
              echo "::error::The exported app lacks $want in com.apple.developer.associated-domains: enable the Associated Domains capability on App ID $APP_ID and rerun so the provisioning profile \"$IOS_PROFILE_NAME\" is recreated (or regenerate the profile in IOS_PROVISIONING_PROFILE_B64)."
              exit 1
            fi
          done
          test "$(ent get-task-allow)" = false
          ls -l "$ipa"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.inputs.outputs.signed == 'true'
        with:
          name: ios-ipa-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal

      - name: Remove keychain, key and profile
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$HOME"/private_keys/AuthKey_*.p8
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -rf "${SIGNING_DIR:-/nonexistent}" "$RUNNER_TEMP/ipa-check"
