name: App Store metadata
# Fills the App Store Connect record of DaisyChess (org.daisychess.app) from the repo:
# apps/mobile/scripts/asc-metadata.mjs (listing texts, categories, age rating, review details,
# custom EULA, price, availability, screenshots, build selection). Idempotent: unchanged fields are
# not written, screenshot sets are replaced only when the files differ. deploy/README.md,
# "App Store metadata".
#
# Inputs: `submit` (default false) also submits the version for App Review; `dry_run` only prints
# the planned changes.
# Secrets: ASC_API_KEY_P8_B64, REVIEW_TOKEN (optional; required with submit).
# Variables: ASC_KEY_ID, ASC_ISSUER_ID, optional REVIEW_CONTACT_PHONE.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the version for App Review after filling the record
        type: boolean
        default: false
      dry_run:
        description: Only print the planned changes (writes nothing)
        type: boolean
        default: false

permissions:
  contents: read

# Two metadata runs at once would race on the screenshot sets.
concurrency:
  group: store-metadata
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      SUBMIT: ${{ inputs.submit }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check inputs
        env:
          HAS_P8: ${{ secrets.ASC_API_KEY_P8_B64 != '' }}
          HAS_TOKEN: ${{ secrets.REVIEW_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_P8" = true ] || missing+=(secret:ASC_API_KEY_P8_B64)
          [ -n "$ASC_KEY_ID" ] || missing+=(variable:ASC_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || missing+=(variable:ASC_ISSUER_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing ${missing[*]} (deploy/README.md, Mobile release)"
            exit 1
          fi
          if [ "$SUBMIT" = true ] && [ "$DRY_RUN" = true ]; then
            echo "::error::submit and dry_run exclude each other"
            exit 1
          fi
          if [ "$SUBMIT" = true ] && [ "$HAS_TOKEN" != true ]; then
            echo "::error::submit=true needs the secret REVIEW_TOKEN (a revocable reviewer token from the portal; the App Review notes quote it)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script uses only Node built-ins: no pnpm install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Fill App Store Connect
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}
          REVIEW_CONTACT_PHONE: ${{ vars.REVIEW_CONTACT_PHONE }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/asc-key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$P8_B64" | base64 --decode > "$key"
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ "$SUBMIT" = true ] && args+=(--submit)
          ASC_KEY_PATH="$key" node apps/mobile/scripts/asc-metadata.mjs "${args[@]}"
