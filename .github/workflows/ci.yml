name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN (docs/SECURITY.md, supply chain).
permissions:
  contents: read

# Third-party actions are pinned by full commit SHA (tags are mutable); the release tag is in the
# trailing comment. Bump SHA and comment together (`git ls-remote https://github.com/<repo> <tag>`).

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # engine-core is consumed from dist by apps/server, so build first
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # nginx configs must carry the CSP built from apps/web/csp.config.mjs (inline script hash)
      - run: node scripts/check-csp.mjs

  e2e:
    runs-on: ubuntu-latest
    env:
      # Same pin as docker/server.Dockerfile; also the engine cache key.
      STOCKFISH_VERSION: sf_19
      STOCKFISH_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Native Stockfish for the server-mode specs (apps/server/engines.json ->
      # engines/stockfish/stockfish). fetch-engines verifies the sha256 and is a no-op on a hit.
      - name: Cache Stockfish
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/stockfish
          key: stockfish-${{ runner.os }}-${{ env.STOCKFISH_VERSION }}-${{ env.STOCKFISH_SHA256 }}
      - run: pnpm fetch-engines
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @daisychess/web exec playwright install --with-deps chromium
      # System libraries are not in the cache.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @daisychess/web exec playwright install-deps chromium

      - run: pnpm build
      - run: pnpm e2e

  # Paths filter for the mobile job (no third-party action): true when the push/PR touches the app
  # or what it is built from. A push without a usable `before` (new branch, force push) runs it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$PR_BASE...$PR_HEAD"; else range="$PUSH_BEFORE..$SHA"; fi
          base=${range%%.*}
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base ($range): run everything"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$range")
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE '^(apps/(mobile|web)/|packages/(engine-core|ui-theme|puzzles)/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # iOS/Android shell (ADR-022, apps/mobile): Android debug APK + emulator smoke on ubuntu, unsigned
  # iOS simulator build + simulator smoke on macOS. The smoke bundle is built with VITE_MOBILE_SMOKE=1
  # (apps/web/src/platform/smoke.ts): the app logs isSecureContext, crossOriginIsolated and a
  # wasm:lite-single bestmove, which scripts/check-smoke-log.mjs asserts. No signing, no secrets.
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    name: mobile (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    env:
      # Store budget per platform (M26-1).
      MAX_APP_BYTES: 15728640
      # Engine server on the runner that the app must reach from its WebView origin (M26-2).
      SMOKE_SERVER_PORT: 18580
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daisychess/engine-core build
      # dist-mobile with the smoke hook, checked (check-dist.mjs), then `cap sync` into both projects.
      # The smoke also says hello to the runner's engine server (CSP gets that loopback origin).
      - run: pnpm --filter @daisychess/mobile build
        env:
          VITE_MOBILE_SMOKE: '1'
          VITE_MOBILE_SMOKE_SERVER_URL: ws://127.0.0.1:${{ env.SMOKE_SERVER_PORT }}/ws
      # `cap sync` must leave the committed native projects unchanged.
      - run: git diff --exit-code -- apps/mobile

      # Standalone server (no engine binaries needed for `welcome`) that allows exactly the app's
      # WebView origins, as the production hub does (M26-2, ADR-022 §4).
      - name: Start engine server for the smoke
        run: |
          pnpm --filter @daisychess/server build
          mkdir -p "apps/mobile/smoke/${{ matrix.platform }}"
          log="$PWD/apps/mobile/smoke/${{ matrix.platform }}/server.log"
          (cd apps/server && PORT=$SMOKE_SERVER_PORT HOST=127.0.0.1 REVIEW_STORE=off MAIA=off \
            ALLOWED_ORIGINS=https://app.daisychess.org,capacitor://app.daisychess.org \
            nohup node dist/index.js > "$log" 2>&1 &)
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:$SMOKE_SERVER_PORT/health" && exit 0
            sleep 1
          done
          cat "$log"
          exit 1

      # --- Android ---
      - if: matrix.platform == 'android'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Android debug APK
        if: matrix.platform == 'android'
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          size=$(stat -c %s "$apk")
          echo "APK: $size bytes"
          test "$size" -le "$MAX_APP_BYTES"
      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash apps/mobile/scripts/android-smoke.sh apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk apps/mobile/smoke/android

      # --- iOS ---
      - name: Select Xcode 26
        if: matrix.platform == 'ios'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: iOS simulator build (unsigned)
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -quiet -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../DerivedData CODE_SIGNING_ALLOWED=NO build
          app=../DerivedData/Build/Products/Debug-iphonesimulator/App.app
          size=$(du -sk "$app" | cut -f1)
          echo "App.app: $((size * 1024)) bytes"
          test "$((size * 1024))" -le "$MAX_APP_BYTES"
      - name: iOS simulator smoke
        if: matrix.platform == 'ios'
        run: bash apps/mobile/scripts/ios-smoke.sh apps/mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app apps/mobile/smoke/ios

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-smoke-${{ matrix.platform }}
          path: apps/mobile/smoke/${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 14
